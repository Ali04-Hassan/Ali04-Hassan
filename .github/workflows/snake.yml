name: Generate Snake Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: Ali04-Hassan
          outputs: |
            dist/github-user-contribution-grid-snake.svg
            dist/github-user-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#f3f4f6,#a7f3d0,#34d399,#059669,#047857

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="blueCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#ff354f"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#334155" fill-opacity="0.45"/>
    </pattern>
  </defs>

  
  <style>
    .title-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; letter-spacing: -0.02em; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .anim-up-1 { animation: fadeUp 0.7s ease-out both; }
    .anim-up-2 { animation: fadeUp 0.7s ease-out 0.15s both; }
    .anim-up-3 { animation: fadeUp 0.7s ease-out 0.3s both; }
    .float-char { animation: floatSlow 4.5s ease-in-out infinite; }
    .pulse { animation: pulseDot 2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x="2" y="2" width="1196" height="496" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="496" rx="22" fill="url(#dotGrid)"/>

  <!-- Header -->
  <text x="36" y="42" fill="#247bff" font-size="12" font-weight="700" letter-spacing="2" class="mono-font">03 // SYSTEMS &amp; INTELLIGENCE</text>
  <text x="36" y="76" fill="#f8fafc" font-size="32" class="title-font">TOOLS CHANGE. CURIOSITY DOESN'T.</text>

  <!-- LEFT: 3 TILTED ELLIPTICAL ORBITS -->
  <g transform="translate(300, 285)">
    <circle cx="0" cy="0" r="160" fill="url(#blueGlow)"/>
    <circle cx="0" cy="0" r="110" fill="url(#crimsonGlow)"/>

    <!-- Orbit 1 -->
    <g transform="rotate(-24)">
      <ellipse cx="0" cy="0" rx="235" ry="78" fill="none" stroke="#247bff" stroke-opacity="0.45" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="235" cy="0" r="22" fill="#0f172a" stroke="#ff354f" stroke-width="1.8"/>
        <text x="235" y="4" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800" class="mono-font">n8n</text>
        <circle cx="-235" cy="0" r="22" fill="#0f172a" stroke="#247bff" stroke-width="1.8"/>
        <text x="-235" y="4" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="800" class="mono-font">Vapi</text>
      </g>
    </g>

    <!-- Orbit 2 -->
    <g transform="rotate(24)">
      <ellipse cx="0" cy="0" rx="235" ry="78" fill="none" stroke="#ff354f" stroke-opacity="0.45" stroke-width="1.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
        <circle cx="235" cy="0" r="22" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
        <text x="235" y="4" text-anchor="middle" fill="#34d399" font-size="10.5" font-weight="800" class="mono-font">Python</text>
        <circle cx="-235" cy="0" r="22" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
        <text x="-235" y="4" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="800" class="mono-font">OpenAI</text>
      </g>
    </g>

    <!-- Orbit 3 -->
    <g transform="rotate(82)">
      <ellipse cx="0" cy="0" rx="185" ry="66" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
        <circle cx="185" cy="0" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
        <text x="185" y="4" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="800" class="mono-font">React</text>
        <circle cx="-185" cy="0" r="20" fill="#0f172a" stroke="#247bff" stroke-width="1.6"/>
        <text x="-185" y="4" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="800" class="mono-font">Docker</text>
      </g>
    </g>

    <!-- Central AI Core -->
    <circle cx="0" cy="0" r="46" fill="#070b16" stroke="url(#blueCrimson)" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="#0f172a"/>
    <text x="0" y="-4" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="900" class="mono-font">AI</text>
    <text x="0" y="13" text-anchor="middle" fill="#247bff" font-size="11" font-weight="800" class="mono-font">ENGINE</text>
  </g>

  <!-- RIGHT: GROUPED STACK CHIPS -->
  <g transform="translate(590, 98)">
    <!-- Group 1 -->
    <rect x="0" y="0" width="574" height="114" rx="14" fill="#0b1224" stroke="#1e293b"/>
    <text x="18" y="26" fill="#247bff" font-size="11.5" font-weight="800" letter-spacing="1.5" class="mono-font">01 // AI AGENTS, VOICE &amp; ORCHESTRATION</text>
    <g transform="translate(18, 40)">
      <rect x="0" y="0" width="76" height="28" rx="7" fill="#ff354f" fill-opacity="0.18" stroke="#ff354f"/><text x="38" y="18" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700" class="mono-font">n8n</text>
      <rect x="86" y="0" width="90" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="131" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">OpenAI</text>
      <rect x="186" y="0" width="88" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="230" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Claude</text>
      <rect x="284" y="0" width="88" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="328" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Gemini</text>
      <rect x="382" y="0" width="76" height="28" rx="7" fill="#247bff" fill-opacity="0.2" stroke="#247bff"/><text x="420" y="18" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700" class="mono-font">Vapi</text>
      <rect x="468" y="0" width="70" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="503" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">RAG</text>

      <rect x="0" y="36" width="116" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="58" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">ElevenLabs</text>
      <rect x="126" y="36" width="102" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="177" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Pinecone</text>
      <rect x="238" y="36" width="90" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="283" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Ollama</text>
      <rect x="338" y="36" width="116" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="396" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">NotebookLM</text>
    </g>

    <!-- Group 2 -->
    <rect x="0" y="128" width="574" height="114" rx="14" fill="#0b1224" stroke="#1e293b"/>
    <text x="18" y="154" fill="#ff354f" font-size="11.5" font-weight="800" letter-spacing="1.5" class="mono-font">02 // LANGUAGES &amp; FULL-STACK FRAMEWORKS</text>
    <g transform="translate(18, 168)">
      <rect x="0" y="0" width="88" height="28" rx="7" fill="#247bff" fill-opacity="0.2" stroke="#247bff"/><text x="44" y="18" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="700" class="mono-font">Python</text>
      <rect x="98" y="0" width="110" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="153" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">TypeScript</text>
      <rect x="218" y="0" width="110" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="273" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">JavaScript</text>
      <rect x="338" y="0" width="66" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="371" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">C++</text>
      <rect x="414" y="0" width="84" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="456" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">React</text>

      <rect x="0" y="36" width="94" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="47" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Node.js</text>
      <rect x="104" y="36" width="96" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="152" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">FastAPI</text>
      <rect x="210" y="36" width="124" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="272" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Tailwind CSS</text>
      <rect x="344" y="36" width="110" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="399" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">PostgreSQL</text>
    </g>

    <!-- Group 3 -->
    <rect x="0" y="256" width="574" height="114" rx="14" fill="#0b1224" stroke="#1e293b"/>
    <text x="18" y="282" fill="#10b981" font-size="11.5" font-weight="800" letter-spacing="1.5" class="mono-font">03 // CLOUD, TELEPHONY &amp; VIBE CODING</text>
    <g transform="translate(18, 296)">
      <rect x="0" y="0" width="86" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="43" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Docker</text>
      <rect x="96" y="0" width="86" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="139" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Vercel</text>
      <rect x="192" y="0" width="102" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="243" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Supabase</text>
      <rect x="304" y="0" width="86" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="347" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Twilio</text>
      <rect x="400" y="0" width="98" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="449" y="18" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Airtable</text>

      <rect x="0" y="36" width="110" height="28" rx="7" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/><text x="55" y="54" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700" class="mono-font">Lovable AI</text>
      <rect x="120" y="36" width="84" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="162" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">v0.dev</text>
      <rect x="214" y="36" width="98" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="263" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">Bolt.new</text>
      <rect x="322" y="36" width="98" height="28" rx="7" fill="#0f172a" stroke="#334155"/><text x="371" y="54" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700" class="mono-font">REST APIs</text>
    </g>
  </g>
</svg>